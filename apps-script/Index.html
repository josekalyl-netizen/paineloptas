<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPTAS Gerencial Inteligente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7F3;--card:#FFFDFB;--tint:#F4ECE4;--tint-2:#FAF3EC;--peach:#FFE3CC;--line:#E8DDD2;--ink:#1E1A17;--ink-2:#4A4038;--mute:#6E625A;--or:#FF811B;--or-d:#A84A0A;--or-m:#C9580B;--green:#1F9D5C;--green-t:#E3F4EA;--red:#D93A2B;--red-t:#FDE6E2;--gold:#FFC233;--gold-t:#FFF4D6;--gold-d:#9A6700;--blue:#2F6FB3;--blue-t:#E5EEF8;--head:'Montserrat',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--sh:0 1px 0 #E6DCD2,0 6px 20px rgba(110,80,50,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{resize:vertical;font:inherit;color:inherit}
.wrap{width:100%;margin:0;padding:20px clamp(16px,2.2vw,40px) 48px}
/* header */
.hd{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hd img{height:58px;width:auto}
.hd .k{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--or-d)}
.hd h1{font-family:var(--head);font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.01em}
.hd h1 span{color:var(--or)}
.hd .meta{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.dk{background:var(--ink);color:var(--bg)}
.pill.ln{background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
.pill.ok{background:var(--green-t);color:var(--green)}
.pill.wa{background:var(--gold-t);color:var(--gold-d)}
.pill.er{background:var(--red-t);color:var(--red)}
.pill.in{background:var(--blue-t);color:var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
/* tabs */
.tabs{display:flex;gap:4px;margin:18px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--or-d);border-bottom-color:var(--or)}
.tab .n{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.view{display:none}.view.on{display:block}
/* layout */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.wrap{padding:14px 16px 40px}.g2,.g3,.g4,.g5{grid-template-columns:minmax(0,1fr)}.hd h1{font-size:22px}.hd img{height:44px}.hd .meta{margin-left:0}}
.mt{margin-top:14px}.mt2{margin-top:22px}
.box{background:var(--card);border-radius:14px;box-shadow:var(--sh);border-top:4px solid var(--or);padding:16px 18px;min-width:0}
.box.dk{border-top-color:var(--ink)}.box.bgr{border-top-color:var(--green)}.box.brd{border-top-color:var(--red)}.box.gd{border-top-color:var(--gold)}.box.bl{border-top-color:var(--blue)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--or-d);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl em{font-style:normal;letter-spacing:0;text-transform:none;font-weight:500;color:var(--mute)}
.sec{font-family:var(--head);font-weight:800;font-size:19px;margin:26px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--mute)}
.v{font-family:var(--head);font-weight:800;font-size:26px;line-height:1.15;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v.sm{font-size:20px}
.v.or{color:var(--or-d)}.v.gr{color:var(--green)}.v.rd{color:var(--red)}.v.mu{color:var(--mute)}
.m{color:var(--mute);font-size:13px;margin-top:4px}
.m b{color:var(--ink)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:2px 6px;vertical-align:middle}
.tag.proj{background:var(--gold-t);color:var(--gold-d)}
.tag.real{background:var(--green-t);color:var(--green)}
.tag.pend{background:var(--red-t);color:var(--red)}
.tag.info{background:var(--blue-t);color:var(--blue)}
.tag.cfg{background:var(--tint);color:var(--ink-2)}
/* question cards */
.q{display:flex;flex-direction:column;gap:2px}
.q .qn{font-size:12px;font-weight:700;color:var(--mute)}
.q .qn i{font-style:normal;color:var(--or)}
/* tables */
.tw{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--tint);white-space:nowrap}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;background:var(--tint-2);border-bottom:0}
tr.sub td{color:var(--mute)}
td.neg{color:var(--red)}td.pos{color:var(--green)}
.dre td:first-child{white-space:normal}
.dre tr.h td{font-weight:700}
.dre tr.ded td:first-child{padding-left:26px;color:var(--ink-2)}
/* bars */
.bar{position:relative;height:10px;background:var(--tint);border-radius:999px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--or)}
.bar i.g{background:var(--green)}.bar i.r{background:var(--red)}.bar i.y{background:repeating-linear-gradient(135deg,#FFD57A 0 8px,#FFE3A8 8px 16px)}
.cmp{display:grid;grid-template-columns:110px 1fr 120px;gap:10px;align-items:center;margin-top:10px}
.cmp .n{font-weight:600}
.cmp .r{text-align:right;font-weight:700}
@media(max-width:720px){.cmp{grid-template-columns:90px 1fr 96px}}
/* tier chips */
.tier{display:inline-block;min-width:44px;text-align:center;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--peach);color:var(--or-d)}
.tier.max{background:var(--green-t);color:var(--green)}
/* alerts */
.al{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--tint)}
.al:last-child{border-bottom:0}
.al .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:14px}
.al.er .ic{background:var(--red-t);color:var(--red)}
.al.wa .ic{background:var(--gold-t);color:var(--gold-d)}
.al.in .ic{background:var(--blue-t);color:var(--blue)}
.al h4{font-size:14px;font-weight:700}
.al p{font-size:13px;color:var(--ink-2);margin-top:2px}
.al .kv{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--mute)}
.al .kv b{color:var(--ink)}
.al .act{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
/* recommendation */
.badge{font-family:var(--head);font-weight:800;font-size:18px;border-radius:12px;padding:14px 18px;text-align:center;min-width:180px}
.badge small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-bottom:2px}
.badge.ok{background:var(--green-t);color:var(--green)}
.badge.wa{background:var(--gold-t);color:var(--gold-d)}
.badge.er{background:var(--red-t);color:var(--red)}
.badge.in{background:var(--blue-t);color:var(--blue)}
.badge.up{background:var(--peach);color:var(--or-d)}
.ind{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ind span{background:var(--tint-2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--ink-2)}
.ind b{color:var(--ink)}
/* forms */
.form{display:grid;grid-template-columns:140px 140px 1fr 1fr auto;gap:8px;align-items:end;margin-top:10px}
@media(max-width:900px){.form{grid-template-columns:1fr 1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
input,select,textarea{resize:vertical;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font-size:14px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--peach);border-color:var(--or)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--or);color:#fff;white-space:nowrap}
.btn:hover{background:var(--or-m)}
.btn.gh{background:var(--card);color:var(--ink-2);border:1px solid var(--line)}
.btn.gh:hover{border-color:var(--or);color:var(--or-d)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px;padding:0 6px}
.x:hover{color:var(--red)}
/* chart */
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;margin-top:12px;padding-bottom:20px;position:relative;border-bottom:1px solid var(--line)}
.chart .c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.chart .c i{display:block;width:100%;max-width:22px;background:var(--or);border-radius:4px 4px 0 0}
.chart .c i.z{background:var(--tint);height:2px!important}
.chart .c i.fut{background:var(--tint)}
.chart .c span{position:absolute;bottom:-18px;font-size:10px;color:var(--mute)}
.chart .lim{position:absolute;left:0;right:0;border-top:2px dashed var(--green)}
.chart .lim em{position:absolute;right:0;top:-18px;font-size:11px;font-style:normal;font-weight:700;color:var(--green);background:var(--card);padding:0 4px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.split{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.empty{padding:22px;text-align:center;color:var(--mute);background:var(--tint-2);border-radius:10px;margin-top:10px}
.ft{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:30px;padding-top:14px;border-top:1px solid var(--line)}
.demo{margin-top:14px;background:var(--gold-t);color:var(--gold-d);border:1px dashed var(--gold);border-radius:10px;padding:10px 14px;font-size:13px}
.res{padding:20px 22px}
.res.lucro{border-top-color:var(--green)}.res.prej{border-top-color:var(--red)}.res.nd{border-top-color:var(--line)}
.resv{display:grid;grid-template-columns:1fr minmax(280px,420px);gap:28px;align-items:center;margin:14px 0 6px}
@media(max-width:900px){.resv{grid-template-columns:1fr}}
.big{display:inline-block;font-family:var(--head);font-weight:800;font-size:15px;letter-spacing:.12em;border-radius:8px;padding:6px 12px}
.big.lucro{background:var(--green-t);color:var(--green)}.big.prej{background:var(--red-t);color:var(--red)}.big.nd{background:var(--tint);color:var(--mute)}
.bigv{font-family:var(--head);font-weight:800;font-size:52px;line-height:1.1;margin:8px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:720px){.bigv{font-size:36px}}
.bigv.lucro{color:var(--green)}.bigv.inv{color:var(--inv)}.bigv.prej{color:var(--red)}.bigv.nd{color:var(--mute)}
.mins .mrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2);margin:6px 0}
.mins .mrow b{font-family:var(--head);font-weight:800}
.mins small{color:var(--mute)}
.gr{color:var(--green)}.rd{color:var(--red)}.mu{color:var(--mute)}
.unit{text-align:left;cursor:pointer;border:0;width:100%;font:inherit;color:inherit}
.unit.lucro{border-top-color:var(--green)}.unit.prej{border-top-color:var(--red)}.unit.nd{border-top-color:var(--line)}
.unit:hover{box-shadow:0 0 0 2px var(--peach),var(--sh)}
.st{font-family:var(--head);font-weight:800;font-size:12px;letter-spacing:.1em;border-radius:6px;padding:3px 8px}
.st.lucro{background:var(--green-t);color:var(--green)}.st.prej{background:var(--red-t);color:var(--red)}.st.nd{background:var(--tint);color:var(--mute)}
.fx{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--tint-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px;color:var(--ink)}
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1.2fr;gap:14px;align-items:stretch;margin-top:16px}
@media(max-width:900px){.eq{grid-template-columns:1fr}.eqo{display:none}}
.eqc{background:var(--tint-2);border-radius:12px;padding:14px 16px;min-width:0}
.eqc.res-lucro{background:var(--green-t)}.eqc.res-prej{background:var(--red-t)}
.eqk{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.res-lucro .eqk,.res-lucro .eqv{color:var(--green)}.res-prej .eqk,.res-prej .eqv{color:var(--red)}
.eqv{font-family:var(--head);font-weight:800;font-size:28px;line-height:1.15;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eqv small{font-size:13px;color:var(--mute);font-weight:600}
.eqv.big2{font-size:34px}
.eqd{font-size:12.5px;color:var(--mute);margin-top:2px}
.eqo{align-self:center;font-family:var(--head);font-weight:800;font-size:28px;color:var(--mute)}
.meta,.flow{margin-top:22px}
.metat{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--or-d);margin-bottom:10px}
.mtrack{position:relative;height:18px;background:var(--tint);border-radius:999px}
.mfill{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.mfill.ok{background:var(--green)}.mfill.no{background:var(--red)}
.mk{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.mk2{background:var(--gold-d)}
.mleg{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.sw1{background:var(--ink)}.sw2{background:var(--gold-d)}
.fl{display:grid;grid-template-columns:minmax(150px,280px) 1fr 140px 150px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--tint);font-size:13.5px}
@media(max-width:720px){.fl{grid-template-columns:1fr auto}.fl .fb,.fl em{display:none}}
.fl b{text-align:right;font-family:var(--head);font-weight:800}
.fl em{font-style:normal;color:var(--mute);font-size:12px}
.fb{height:10px;background:var(--tint);border-radius:999px;overflow:hidden}
.fb i{display:block;height:100%;background:var(--or);border-radius:999px}
.fb i.dash{background:repeating-linear-gradient(135deg,var(--or) 0 6px,#FFC48F 6px 12px)}
.fl.tot{border-bottom:0;background:var(--tint-2);border-radius:8px;padding:9px 10px;margin:4px 0;font-weight:700}
.fl.tot.lucro b,.fl.tot.lucro span{color:var(--green)}.fl.tot.prej b,.fl.tot.prej span{color:var(--red)}
.fl.res2{border-bottom:0}
.ych{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-top:12px}
.yc{display:flex;flex-direction:column;align-items:center}
.yp,.yn{height:72px;width:100%;display:flex;justify-content:center}
.yp{align-items:flex-end;border-bottom:1px solid var(--line)}.yn{align-items:flex-start}
.yc i{display:block;width:70%;max-width:34px;border-radius:4px}
.yc i.g{background:var(--green);border-radius:4px 4px 0 0}.yc i.r{background:var(--red);border-radius:0 0 4px 4px}
.yc span{font-size:11px;color:var(--mute);text-transform:capitalize}
@media print{.tabs,.hd .meta,.demo,.btn,.ft,.toast,.x{display:none!important}.view{display:none!important}.view.on{display:block!important}body{background:#fff}.box{box-shadow:none;border:1px solid var(--line)}}
.tl{position:relative;margin-left:8px;border-left:2px solid var(--peach);padding-left:18px}
.tld{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--or-d);margin:14px 0 6px;position:relative}
.tld:first-child{margin-top:0}
.tld::before{content:'';position:absolute;left:-25px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--or);box-shadow:0 0 0 3px var(--card)}
.tli{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:var(--tint-2);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.tlp{display:none}
.tlc b{font-size:14px}.tlc .m{margin-top:2px;font-size:12px}
.tlv{font-family:var(--head);font-weight:800;font-size:16px}
.plan{font-size:12px;font-weight:600;color:var(--mute);margin-top:2px}.plan.ok{color:var(--green)}.plan.no{color:var(--red)}
.mgs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.mgs{grid-template-columns:1fr}}
.mg{background:var(--tint-2);border-radius:12px;padding:12px 14px}
.mgh{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2)}
.mgd{font-size:12px;color:var(--mute);margin-top:2px}
.mga{font-size:12.5px;color:var(--ink-2);margin-right:auto}
.mgh b{font-family:var(--head);font-weight:800;color:var(--ink)}
.mgt{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:10px 0 8px}
.mgt i{display:block;height:100%;border-radius:999px}.mgt i.ok{background:var(--green)}.mgt i.no{background:var(--or)}
.mgf{display:flex;justify-content:flex-end;min-height:24px;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
/* cores por natureza do dinheiro: verde entra · vermelho sai · amarelo investimento */
:root{--inv:#B07D00;--inv-b:#F2B632;--inv-t:#FFF4D6}
.v.in,.in{color:var(--green)}.v.out,.out{color:var(--red)}.v.inv,b.inv,.inv{color:var(--inv)}
.box.q.k-in{border-top-color:var(--green)}.box.q.k-out{border-top-color:var(--red)}.box.q.k-inv{border-top-color:var(--inv-b)}.box.q.k-n,.box.q.k-{border-top-color:var(--ink)}.box.q.k-mu{border-top-color:var(--line)}
.eqc.c-in{background:var(--green-t)}.eqc.c-in .eqk,.eqc.c-in .eqv{color:var(--green)}
.eqc.c-out{background:var(--red-t)}.eqc.c-out .eqk,.eqc.c-out .eqv{color:var(--red)}
.fb i.out{background:var(--red)}.fb i.inv{background:var(--inv-b)}
.mgrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media(max-width:600px){.mgrow{grid-template-columns:1fr}}
.mgc{display:flex;justify-content:space-between;align-items:center;border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink-2);background:var(--tint-2)}
.mgc b{font-family:var(--head);font-weight:800;font-size:18px}
.mgc.c-in b{color:var(--green)}.mgc.c-out b{color:var(--red)}.mgc.c-inv b{color:var(--inv)}
.fl.sub-tot{border-bottom:1px dashed var(--line);font-weight:700}
.fl.inv2 .invpar{display:flex;gap:18px}.fl.inv2 .invpar div{display:flex;flex-direction:column}.fl.inv2 small{font-size:11px;color:var(--mute)}.fl.inv2 .invpar b{color:var(--inv);font-size:14px;text-align:left}

// Mínimos do valor a receber no mês (receita bruta, antes do imposto de 15%)
// empate:      R − 15%R − comissões − estrutura = 0
// sustentável: além disso, cobre a reserva de marketing (15% da produção) → R = (comissões + estrutura + reserva) ÷ 0,85
function minimos(comissoes, estrutura, reserva) {
  var i = REGRAS.imposto, m = REGRAS.reservaMarketing;
  // menor valor em centavos que, depois do imposto arredondado, cobre o necessário
  var minimo = function (precisa) { precisa = r2(precisa); var x = Math.ceil(precisa / (1 - i) * 100 - 1e-6) / 100; while (r2(x - r2(x * i)) < precisa) x = r2(x + 0.01); while (x > 0 && r2((x - 0.01) - r2((x - 0.01) * i)) >= precisa) x = r2(x - 0.01); return x; };
  return { empate: minimo(comissoes + estrutura), sustentavel: minimo(comissoes + estrutura + (reserva || 0)) };
}

function compor(p) {
  var o = Object.assign({}, p), tem = p.recebidas != null;
  o.imposto = tem ? (p.imposto != null ? p.imposto : r2(p.recebidas * REGRAS.imposto)) : null;
  o.saiu = tem ? r2(o.imposto + p.comissoes + p.fixo + p.provisao) : null;
  o.resultado = tem ? r2(p.recebidas - o.saiu) : null;
  o.reserva = r2((p.producao || 0) * REGRAS.reservaMarketing);
  o.depois = tem ? r2(o.resultado - r2(p.investido || 0)) : null;   // lucro líquido = lucro bruto − investido real
  return o;
}
function fotoMes() {

function mesesDoAno(ano) { return Object.keys(ESTADO.fechamentos).filter(function (k) { return k.slice(0, 4) === String(ano); }).sort(); }

/* =====================================================================
   VITALÍCIO DA CARTEIRA

    if (!rg || rg.vit == null) { g.semRegra = r2(g.semRegra + valor); o.semRegra = r2(o.semRegra + valor); o.nSemRegra++; return; }

  rec.forEach(function (x) { var g = o.porOp[x.operadora] = o.porOp[x.operadora] || { qtd: 0, valor: 0, pct: null, previsto: 0, semRegra: 0 }; g.recebido = r2((g.recebido || 0) + (+x.valor || 0)); });

function cpfFicticio(n) { var d = String(100000000 + n * 7919).slice(-9).split('').map(Number); for (var t = 9; t < 11; t++) { var s = 0; for (var i = 0; i < t; i++) s += d[i] * (t + 1 - i); d.push((s * 10 % 11) % 10); } return d.join(''); }
function cnpjFicticio(n) { var d = (String(10000000 + n * 104729).slice(-8) + '0001').split('').map(Number); [[5,4,3,2,9,8,7,6,5,4,3,2],[6,5,4,3,2,9,8,7,6,5,4,3,2]].forEach(function (w) { var s = 0; w.forEach(function (x, i) { s += d[i] * x; }); var r = s % 11; d.push(r < 2 ? 0 : 11 - r); }); return d.join(''); }

  var ops = [['Bradesco', 'PME'], ['Amil', 'PME'], ['SulAmérica', 'PME'], ['Hapvida', 'PME'], ['MedSênior', 'PF'], ['Prevent Senior', 'PF'], ['Supermed', 'ADESÃO'], ['Qualicorp SP', 'ADESÃO'], ['Trasmontano', 'PME'], ['Santa Helena', 'PME'], ['Sobam', 'PME'], ['Ana Costa', 'PME'], ['Porto Saúde', 'PME'], ['Alice', 'PME'], ['Seguros Unimed', 'PME'], ['Hapvida', 'PF'], ['São Cristóvão', 'PF'], ['Biovida', 'PF'], ['NotreDame', 'PME'], ['Unimed GRU', 'PME'], ['Odontoprev', 'PME'], ['Plena Saúde', 'PF']];
  var camp = ['Meta Ads Bradesco PME', 'Leads Amil PF', 'Indicação', 'Carteira ativa', 'Google Ads Saúde', 'Panfletagem Mogi'];
  D.vendedores.forEach(function (v, i) {
    var partes = [];
    if (v.hap > 0) [0.6, 0.4].forEach(function (w, k) { partes.push({ total: r2(v.hap), w: w, op: 'Hapvida', mod: k ? 'PME' : 'PF', projeto: 'Projeto Hapvida' }); });
    if (v.fora > 0) [0.5, 0.3, 0.2].forEach(function (w, k) { var o = ops[(i * 3 + k) % ops.length]; partes.push({ total: r2(v.fora), w: w, op: o[0], mod: o[1], projeto: '' }); });
    ['Projeto Hapvida', ''].forEach(function (pj) {
      var g = partes.filter(function (x) { return x.projeto === pj; }); if (!g.length) return;
      ratear(g, g[0].total, function (x) { return x.total * x.w; }, 'valor');
    });
    partes.forEach(function (x, k) {
      n++; var pme = x.mod === 'PME', dia = String(2 + (n * 3) % 26).padStart(2, '0');
      out.push({ id_venda: 'EX-' + String(n).padStart(3, '0'), contrato: 'C-' + String(n).padStart(4, '0'), projeto: x.projeto, operadora: x.op, modalidade: x.mod,
        cliente: pme ? 'Empresa Exemplo ' + String(n).padStart(2, '0') + ' Ltda' : 'Titular Exemplo ' + String(n).padStart(2, '0'), documento: pme ? cnpjFicticio(n) : cpfFicticio(n),
        valor_mensal: x.valor, vidas: x.projeto ? (pme ? 12 + (n * 11) % 30 : 2 + (n * 5) % 12) : (pme ? 3 + (n * 7) % 18 : 1 + (n % 4)), data_nascimento: pme ? '' : (1950 + (n * 13) % 50) + '-0' + (1 + n % 9) + '-15', vendedor: v.nome, unidade: v.equipe, data_venda: mes + '-' + dia,
        origem: camp[n % camp.length], campanha: camp[n % camp.length], valor_recebido: '' });
    });
  });
  return out;
}

function iniciar() {
  if (PUBLICADO) ['pen', 'reg'].forEach(function (v) { var b = document.querySelector('.tab[data-v="' + v + '"]'), sc = document.getElementById('v-' + v); if (b) b.remove(); if (sc) sc.remove(); });

  window.addEventListener('storage', function (e) { if (e.key === LS_KEY && !GAS && !DEMO) { ESTADO = normEstado(carregarEstadoLocal()); render(); } });
  var tab = location.hash.slice(1); if (!tab) { try { tab = localStorage.getItem('optas_tab'); } catch (e) {} }
  if (GAS) {
    google.script.run.withSuccessHandler(function (r) {
      var x = typeof r === 'string' ? JSON.parse(r) : r;
      FONTE = x && x.dados ? x.dados : SNAPSHOT; FONTE_DESC = x && x.dados ? 'painel gerencial integrado (PipeRun + ASI) · atualizado às ' + (FONTE.atualizado || '—') : SNAPSHOT_ORIGEM + ' — integração indisponível';
      ESTADO = normEstado(x && x.estado ? JSON.parse(x.estado) : null);
      render(); if (tab) show(tab);
    }).withFailureHandler(function () { FONTE = SNAPSHOT; FONTE_DESC = SNAPSHOT_ORIGEM; render(); }).optasCarregar();
    setInterval(function () { google.script.run.withSuccessHandler(function (r) { var x = typeof r === 'string' ? JSON.parse(r) : r; if (x && x.dados) { FONTE = x.dados; render(); } }).optasCarregar(); }, 5 * 60 * 1000);
  } else {
