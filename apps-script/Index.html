<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPTAS Gerencial Inteligente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7F3;--card:#FFFDFB;--tint:#F4ECE4;--tint-2:#FAF3EC;--peach:#FFE3CC;--line:#E8DDD2;--ink:#1E1A17;--ink-2:#4A4038;--mute:#6E625A;--or:#FF811B;--or-d:#A84A0A;--or-m:#C9580B;--green:#1F9D5C;--green-t:#E3F4EA;--red:#D93A2B;--red-t:#FDE6E2;--gold:#FFC233;--gold-t:#FFF4D6;--gold-d:#9A6700;--blue:#2F6FB3;--blue-t:#E5EEF8;--head:'Montserrat',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--sh:0 1px 0 #E6DCD2,0 6px 20px rgba(110,80,50,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:20px 24px 48px}
/* header */
.hd{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hd img{height:58px;width:auto}
.hd .k{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--or-d)}
.hd h1{font-family:var(--head);font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.01em}
.hd h1 span{color:var(--or)}
.hd .meta{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.dk{background:var(--ink);color:var(--bg)}
.pill.ln{background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
.pill.ok{background:var(--green-t);color:var(--green)}
.pill.wa{background:var(--gold-t);color:var(--gold-d)}
.pill.er{background:var(--red-t);color:var(--red)}
.pill.in{background:var(--blue-t);color:var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
/* tabs */
.tabs{display:flex;gap:4px;margin:18px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--or-d);border-bottom-color:var(--or)}
.tab .n{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.view{display:none}.view.on{display:block}
/* layout */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.wrap{padding:14px 16px 40px}.g2,.g3,.g4,.g5{grid-template-columns:minmax(0,1fr)}.hd h1{font-size:22px}.hd img{height:44px}.hd .meta{margin-left:0}}
.mt{margin-top:14px}.mt2{margin-top:22px}
.box{background:var(--card);border-radius:14px;box-shadow:var(--sh);border-top:4px solid var(--or);padding:16px 18px;min-width:0}
.box.dk{border-top-color:var(--ink)}.box.gr{border-top-color:var(--green)}.box.rd{border-top-color:var(--red)}.box.gd{border-top-color:var(--gold)}.box.bl{border-top-color:var(--blue)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--or-d);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl em{font-style:normal;letter-spacing:0;text-transform:none;font-weight:500;color:var(--mute)}
.sec{font-family:var(--head);font-weight:800;font-size:19px;margin:26px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--mute)}
.v{font-family:var(--head);font-weight:800;font-size:26px;line-height:1.15;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v.sm{font-size:20px}
.v.or{color:var(--or-d)}.v.gr{color:var(--green)}.v.rd{color:var(--red)}.v.mu{color:var(--mute)}
.m{color:var(--mute);font-size:13px;margin-top:4px}
.m b{color:var(--ink)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:2px 6px;vertical-align:middle}
.tag.proj{background:var(--gold-t);color:var(--gold-d)}
.tag.real{background:var(--green-t);color:var(--green)}
.tag.pend{background:var(--red-t);color:var(--red)}
.tag.info{background:var(--blue-t);color:var(--blue)}
.tag.cfg{background:var(--tint);color:var(--ink-2)}
/* question cards */
.q{display:flex;flex-direction:column;gap:2px}
.q .qn{font-size:12px;font-weight:700;color:var(--mute)}
.q .qn i{font-style:normal;color:var(--or)}
/* tables */
.tw{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--tint);white-space:nowrap}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;background:var(--tint-2);border-bottom:0}
tr.sub td{color:var(--mute)}
td.neg{color:var(--red)}td.pos{color:var(--green)}
.dre td:first-child{white-space:normal}
.dre tr.h td{font-weight:700}
.dre tr.ded td:first-child{padding-left:26px;color:var(--ink-2)}
/* bars */
.bar{position:relative;height:10px;background:var(--tint);border-radius:999px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--or)}
.bar i.g{background:var(--green)}.bar i.r{background:var(--red)}.bar i.y{background:repeating-linear-gradient(135deg,#FFD57A 0 8px,#FFE3A8 8px 16px)}
.cmp{display:grid;grid-template-columns:110px 1fr 120px;gap:10px;align-items:center;margin-top:10px}
.cmp .n{font-weight:600}
.cmp .r{text-align:right;font-weight:700}
@media(max-width:720px){.cmp{grid-template-columns:90px 1fr 96px}}
/* tier chips */
.tier{display:inline-block;min-width:44px;text-align:center;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--peach);color:var(--or-d)}
.tier.max{background:var(--green-t);color:var(--green)}
/* alerts */
.al{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--tint)}
.al:last-child{border-bottom:0}
.al .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:14px}
.al.er .ic{background:var(--red-t);color:var(--red)}
.al.wa .ic{background:var(--gold-t);color:var(--gold-d)}
.al.in .ic{background:var(--blue-t);color:var(--blue)}
.al h4{font-size:14px;font-weight:700}
.al p{font-size:13px;color:var(--ink-2);margin-top:2px}
.al .kv{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--mute)}
.al .kv b{color:var(--ink)}
.al .act{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
/* recommendation */
.badge{font-family:var(--head);font-weight:800;font-size:18px;border-radius:12px;padding:14px 18px;text-align:center;min-width:180px}
.badge small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-bottom:2px}
.badge.ok{background:var(--green-t);color:var(--green)}
.badge.wa{background:var(--gold-t);color:var(--gold-d)}
.badge.er{background:var(--red-t);color:var(--red)}
.badge.in{background:var(--blue-t);color:var(--blue)}
.badge.up{background:var(--peach);color:var(--or-d)}
.ind{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ind span{background:var(--tint-2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--ink-2)}
.ind b{color:var(--ink)}
/* forms */
.form{display:grid;grid-template-columns:140px 140px 1fr 1fr auto;gap:8px;align-items:end;margin-top:10px}
@media(max-width:900px){.form{grid-template-columns:1fr 1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font-size:14px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--peach);border-color:var(--or)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--or);color:#fff;white-space:nowrap}
.btn:hover{background:var(--or-m)}
.btn.gh{background:var(--card);color:var(--ink-2);border:1px solid var(--line)}
.btn.gh:hover{border-color:var(--or);color:var(--or-d)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px;padding:0 6px}
.x:hover{color:var(--red)}
/* chart */
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;margin-top:12px;padding-bottom:20px;position:relative;border-bottom:1px solid var(--line)}
.chart .c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.chart .c i{display:block;width:100%;max-width:22px;background:var(--or);border-radius:4px 4px 0 0}
.chart .c i.z{background:var(--tint);height:2px!important}
.chart .c i.fut{background:var(--tint)}
.chart .c span{position:absolute;bottom:-18px;font-size:10px;color:var(--mute)}
.chart .lim{position:absolute;left:0;right:0;border-top:2px dashed var(--green)}
.chart .lim em{position:absolute;right:0;top:-18px;font-size:11px;font-style:normal;font-weight:700;color:var(--green);background:var(--card);padding:0 4px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.split{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.empty{padding:22px;text-align:center;color:var(--mute);background:var(--tint-2);border-radius:10px;margin-top:10px}
.ft{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:30px;padding-top:14px;border-top:1px solid var(--line)}
.demo{margin-top:14px;background:var(--gold-t);color:var(--gold-d);border:1px dashed var(--gold);border-radius:10px;padding:10px 14px;font-size:13px}
.res{padding:20px 22px}
.res.lucro{border-top-color:var(--green)}.res.prej{border-top-color:var(--red)}.res.nd{border-top-color:var(--line)}
.resv{display:grid;grid-template-columns:1fr minmax(280px,420px);gap:28px;align-items:center;margin:14px 0 6px}
@media(max-width:900px){.resv{grid-template-columns:1fr}}
.big{display:inline-block;font-family:var(--head);font-weight:800;font-size:15px;letter-spacing:.12em;border-radius:8px;padding:6px 12px}
.big.lucro{background:var(--green-t);color:var(--green)}.big.prej{background:var(--red-t);color:var(--red)}.big.nd{background:var(--tint);color:var(--mute)}
.bigv{font-family:var(--head);font-weight:800;font-size:52px;line-height:1.1;margin:8px 0 4px}
@media(max-width:720px){.bigv{font-size:36px}}
.bigv.lucro{color:var(--green)}.bigv.prej{color:var(--red)}.bigv.nd{color:var(--mute)}
.mins .mrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2);margin:6px 0}
.mins .mrow b{font-family:var(--head);font-weight:800}
.mins small{color:var(--mute)}
.gr{color:var(--green)}.rd{color:var(--red)}.mu{color:var(--mute)}
.unit{text-align:left;cursor:pointer;border:0;width:100%;font:inherit;color:inherit}
.unit.lucro{border-top-color:var(--green)}.unit.prej{border-top-color:var(--red)}.unit.nd{border-top-color:var(--line)}
.unit:hover{box-shadow:0 0 0 2px var(--peach),var(--sh)}
.st{font-family:var(--head);font-weight:800;font-size:12px;letter-spacing:.1em;border-radius:6px;padding:3px 8px}
.st.lucro{background:var(--green-t);color:var(--green)}.st.prej{background:var(--red-t);color:var(--red)}.st.nd{background:var(--tint);color:var(--mute)}
.fx{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--tint-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px;color:var(--ink)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;transition:transform .3s,opacity .3s;z-index:9;opacity:0;pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
details.rules{margin-top:10px}
details.rules summary{cursor:pointer;font-weight:600;color:var(--or-d)}
.kpirow{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.kpirow div{font-size:12px;color:var(--mute)}
.kpirow b{display:block;font-family:var(--head);font-weight:800;font-size:16px;color:var(--ink)}
</style>
</head>

  }
  if (semMod > 0) R.alertas.push({ sev: 'wa', cod: 'MODALIDADE', titulo: semMod + ' venda(s) sem modalidade PF/PME', texto: 'Não é possível confirmar qual tabela (PF ou PME) se aplica.', impacto: 'O agenciamento calculado usa o percentual informado sem distinção de modalidade e fica marcado como PROVISÓRIO.', acao: 'Corrigir os registros no painel gerencial e informar a modalidade das operadoras (Pendência 1).', registros: semMod });

  if (Object.keys(opSemRegra).length) R.alertas.push({ sev: 'er', cod: 'TABELA', titulo: 'Sem tabela de comissão: ' + Object.keys(opSemRegra).join(', '), texto: ag.naoCalcQtd + ' venda(s), ' + brl(ag.naoCalc) + ' de mensalidade.', impacto: 'Agenciamento e vitalício dessas vendas não calculados.', acao: opSemRegra['Projeto Hapvida'] ? 'Informar agenciamento e vitalício do Projeto Hapvida (Pendência 8)' + (Object.keys(opSemRegra).length > 1 ? ' e das demais operadoras (Pendência 1).' : '.') : 'Informar agenciamento, vitalício e modalidade (Pendência 1).' });
  Object.keys(camposFaltando).forEach(function (f) {
    if (f === 'origem' || f === 'modalidade' || f === 'operadora') return;
    var ids = camposFaltando[f];
    R.alertas.push({ sev: 'wa', cod: 'CAMPO_' + f, titulo: ids.length + ' contrato(s) sem o campo "' + f + '"', texto: 'Registros: ' + ids.slice(0, 12).join(', ') + (ids.length > 12 ? '…' : ''), impacto: impactoCampo(f), acao: 'Corrigir no painel gerencial e reimportar.', registros: ids.length });
  });
  ag.imposto = ag.valor * REGRAS.imposto; ag.impostoVit = ag.vit * REGRAS.imposto;
  R.ag = ag;

  // ---------- Unidades ----------
  var prodTot = 0, comTot = 0;
  REGRAS.unidades.forEach(function (u) {
    var vs = R.vendedores.filter(function (v) { return v.unidade === u; });
    var U = R.unidades[u];
    U.vendedores = vs.length;
    U.producao = sum(vs, function (v) { return v.producao; });
    U.prodHap = sum(vs, function (v) { return v.prodHap; });
    U.prodFora = sum(vs, function (v) { return v.prodFora; });
    U.comissao = sum(vs, function (v) { return v.comissao; });
    var eq = D && D.equipes ? D.equipes.filter(function (e) { return unidadeCanon(e.nome) === u; })[0] : null;
    var pjU = projeto('Projeto Hapvida');
    U.agPrev = eq && pjU.ag != null ? (eq.hap.valor || 0) * pjU.ag : null;
    if (usarContratos) U.agPrev = sum(contratosMes.filter(function (c) { return unidadeCanon(c.unidade) === u; }), function (c) { var o = regraVenda(c); return o && o.ag ? (+c.valor_mensal || 0) * o.ag : 0; });
    U.leads = eq ? eq.hap.leads : null; U.vidas = eq ? eq.hap.vidas : null; U.qtd = eq ? (eq.hap.qtd + eq.fora.qtd) : null;
    var rec = (ESTADO.recebidas[R.mes] || {})[u];
    U.recebidas = rec != null && rec !== '' ? +rec : null;
    U.res = resultado(U.recebidas, U.comissao, U.custos.fixo, U.custos.provisao);
    prodTot += U.producao; comTot += U.comissao;
  });

  R.recebidasInformadas = recU.filter(function (x) { return x != null; }).length;
  R.recebidas = R.recebidasInformadas === REGRAS.unidades.length ? sum(recU) : null;
  R.res = resultado(R.recebidas, comTot, R.custoFixo, R.provisao);
  if (R.recebidas == null) R.alertas.push({ sev: 'wa', cod: 'RECEBIDAS', titulo: 'Comissões efetivamente recebidas de ' + mesLabel(R.mes) + ' não lançadas' + (R.recebidasInformadas ? ' (falta ' + REGRAS.unidades.filter(function (u) { return R.unidades[u].recebidas == null; }).join(', ') + ')' : ''), texto: 'A reserva de marketing usa apenas comissões efetivamente recebidas — valores a receber não contam.', impacto: 'Lucro bruto operacional, reserva de marketing, saldo de investimento, resultado operacional e financeiro.', acao: 'Lançar os valores recebidos na aba Financeiro.', irPara: 'fin' });

  // ---------- Investimentos / ROI ----------

}

function impactoCampo(f) {
  return ({ valor_mensal: 'Produção, comissão do vendedor e agenciamento', vendedor: 'Comissão do vendedor', unidade: 'Faixa de comissão e resultado por unidade', data_venda: 'Competência do mês e início do vitalício', contrato: 'Rastreamento do vitalício', id_venda: 'Identificação da venda' })[f] || 'Indicadores dependentes';
}

// Lucro bruto operacional = recebidas − comissões dos vendedores (regra 9.1, sem descontar impostos ou custos)
function resultado(recebidas, comissoes, fixo, provisao) {
  if (recebidas == null) return null;
  var imp = recebidas * REGRAS.imposto;
  var lbo = recebidas - comissoes;
  var reserva = Math.max(0, lbo) * REGRAS.reservaMarketing;
  var operacional = recebidas - imp - comissoes - fixo - provisao;
  return { recebidas: recebidas, imposto: imp, comissoes: comissoes, lbo: lbo, reserva: reserva, fixo: fixo, provisao: provisao, operacional: operacional, financeiro: operacional - reserva };
}

function calcularROI(R) {
  var mes = R.mes, dias = diasNoMes(mes);
  var inv = ESTADO.investimentos.filter(function (i) { return (i.data || '').slice(0, 7) === mes; }).sort(function (a, b) { return a.data < b.data ? -1 : 1; });
  var total = sum(inv, function (i) { return +i.valor || 0; });
  var hoje = hojeISO(), diaRef;
  if (hoje.slice(0, 7) === mes) diaRef = +hoje.slice(8, 10);
  else if (hoje.slice(0, 7) > mes) diaRef = dias;
  else diaRef = inv.length ? +inv[inv.length - 1].data.slice(8, 10) : 1;
  var media = diaRef ? total / diaRef : 0;
  var porDia = {}; inv.forEach(function (i) { var d = +i.data.slice(8, 10); porDia[d] = (porDia[d] || 0) + (+i.valor || 0); });
  var porCat = {}; inv.forEach(function (i) { var k = i.categoria || 'Sem categoria'; porCat[k] = (porCat[k] || 0) + (+i.valor || 0); });
  var porCamp = {}; inv.forEach(function (i) { var k = i.campanha ? norm(i.campanha) : ''; if (!k) return; porCamp[k] = porCamp[k] || { nome: i.campanha, investido: 0, contratos: [], retornoReal: 0, recebido: 0 }; porCamp[k].investido += +i.valor || 0; });

  var reserva = R.res ? R.res.reserva : null;
  var saldo = reserva != null ? reserva - total : null;

  // Atribuição: contratos com origem/campanha
  var pctVend = {}; R.vendedores.forEach(function (v) { pctVend[norm(v.nome)] = v.pct; });
  var atrib = [], semAtrib = 0;
  ESTADO.contratos.filter(function (c) { return (c.data_venda || '').slice(0, 7) === mes; }).forEach(function (c) {
    var k = norm(c.campanha || c.origem || '');
    if (!k) { semAtrib++; return; }
    var o = regraVenda(c); var valor = +c.valor_mensal || 0;
    var agv = o && o.ag ? valor * o.ag : null;
    var pv = pctVend[norm(c.vendedor)];
    var comV = pv != null ? valor * pv : null;
    var liq = agv != null && comV != null ? agv * (1 - REGRAS.imposto) - comV : null;
    var rec = c.valor_recebido != null && c.valor_recebido !== '' ? +c.valor_recebido : null;
    var liqReal = rec != null && comV != null ? rec * (1 - REGRAS.imposto) - comV : null;
    var row = { c: c, ag: agv, vit: o && o.vit != null ? valor * o.vit : null, imposto: agv != null ? agv * REGRAS.imposto : null, comV: comV, liq: liq, rec: rec, liqReal: liqReal };
    atrib.push(row);
    var camp = porCamp[k] || (porCamp[k] = { nome: c.campanha || c.origem, investido: 0, contratos: [], retornoReal: 0, recebido: 0 });
    camp.contratos.push(row); if (liqReal != null) { camp.retornoReal += liqReal; camp.recebido += rec; }
  });
  var invAtrib = sum(Object.keys(porCamp), function (k) { return porCamp[k].contratos.length ? porCamp[k].investido : 0; });
  var retReal = sum(atrib, function (a) { return a.liqReal || 0; });
  var temReal = atrib.some(function (a) { return a.liqReal != null; });
  var roiReal = invAtrib > 0 && temReal ? (retReal - invAtrib) / invAtrib : null;

  // Ponto de equilíbrio por R$ 1 de mensalidade Hapvida (usa percentuais efetivos do mês)
  var pctEf = R.producao ? R.comissoes / R.producao : null;
  var hap = operadora('Hapvida'); // Hapvida fora do projeto
  var liqPorReal = pctEf != null ? hap.ag * (1 - REGRAS.imposto) - pctEf : null;

  var o = { mes: mes, dias: dias, diaRef: diaRef, inv: inv, total: total, media: media, porDia: porDia, porCat: porCat, porCamp: porCamp,
    reserva: reserva, saldo: saldo, consumo: reserva ? total / reserva : null,
    atrib: atrib, semAtrib: semAtrib, invAtrib: invAtrib, retReal: retReal, roiReal: roiReal, temReal: temReal,
    pctEf: pctEf, liqPorReal: liqPorReal, diasRest: Math.max(0, dias - diaRef) };
  if (total > 0 && invAtrib === 0) R.alertas.push({ sev: 'er', cod: 'ROI_ATRIB', titulo: 'Investimentos sem contratos atribuídos', texto: brl(total) + ' investidos em ' + mesLabel(mes) + ' sem contrato com origem/campanha correspondente.', impacto: 'O ROI não pode ser calculado.', acao: 'Lançar a campanha em cada investimento e garantir origem/campanha nos contratos.', irPara: 'roi' });
  if (inv.some(function (i) { return !i.campanha; })) R.alertas.push({ sev: 'in', cod: 'INV_CAMP', titulo: inv.filter(function (i) { return !i.campanha; }).length + ' lançamento(s) de investimento sem campanha', texto: 'Sem campanha, o valor não pode ser cruzado com os contratos gerados.', impacto: 'Atribuição de retorno', acao: 'Editar o lançamento e informar a campanha/origem.', irPara: 'roi' });
  return o;
}

// Mínimos de comissões recebidas no mês (receita bruta, antes do imposto de 15%)
// empate:      R − 15%R − comissões − estrutura = 0
// sustentável: além disso, forma a reserva de 15% do lucro bruto operacional  → 0,70R = 0,85·comissões + estrutura
function minimos(comissoes, estrutura) {
  var i = REGRAS.imposto, m = REGRAS.reservaMarketing;
  return { empate: (comissoes + estrutura) / (1 - i), sustentavel: ((1 - m) * comissoes + estrutura) / (1 - i - m) };
}
function blocoResultado(titulo, res, recebidas, comissoes, fixo, prov, aviso) {

  h += '<div class="resv"><div><div class="big ' + st + '">' + (res ? (res.operacional >= 0 ? 'LUCRO' : 'PREJUÍZO') : 'SEM RECEBIDAS LANÇADAS') + '</div>'
    + '<div class="bigv ' + st + '">' + (res ? brl(res.operacional) : '—') + '</div>'
    + '<div class="m">' + (res ? 'Resultado operacional · margem ' + pct(recebidas ? res.operacional / recebidas : null, 1) + ' · após reserva de marketing <b class="' + (res.financeiro >= 0 ? 'gr' : 'rd') + '">' + brl(res.financeiro) + '</b>' : (aviso || 'Comissões recebidas do mês não lançadas.')) + '</div></div>';
  var p1 = recebidas != null ? recebidas / mn.empate : 0, p2 = recebidas != null ? recebidas / mn.sustentavel : 0;

    + '<div class="mrow"><span>' + (recebidas != null ? (recebidas >= mn.empate ? 'Acima do mínimo' : 'Abaixo do mínimo') : 'Diferença') + '</span><b class="' + (recebidas != null ? (recebidas >= mn.empate ? 'gr' : 'rd') : '') + '">' + (recebidas != null ? brl(recebidas - mn.empate) : '—') + '</b></div>'
    + '<div class="mrow" style="margin-top:10px"><span>Mínimo sustentável <small>(inclui reserva de 15%)</small></span><b>' + brl(mn.sustentavel) + '</b></div>' + bar(p2, p2 >= 1 ? 'g' : 'y')
    + '<div class="mrow"><span>' + (recebidas != null ? (recebidas >= mn.sustentavel ? 'Acima do sustentável' : 'Abaixo do sustentável') : 'Diferença') + '</span><b class="' + (recebidas != null ? (recebidas >= mn.sustentavel ? 'gr' : 'rd') : '') + '">' + (recebidas != null ? brl(recebidas - mn.sustentavel) : '—') + '</b></div></div></div>';
  var imp = recebidas != null ? recebidas * REGRAS.imposto : null;
  h += '<div class="tw"><table class="dre"><tbody>'
    + '<tr class="h"><td>Comissões efetivamente recebidas</td><td class="r">' + brl(recebidas) + '</td></tr>'

    + '<tr class="ded"><td>(−) Reserva de marketing (15% do lucro bruto operacional)</td><td class="r">' + (res ? brl(-res.reserva) : '—') + '</td></tr>'

function vUnidade(u) {

  h += '<div class="sec">Registro diário de investimento</div><div class="box"><div class="form"><label class="f">Data<input type="date" id="invData" value="' + (hojeISO().slice(0, 7) === R.mes ? hojeISO() : R.mes + '-01') + '"></label><label class="f">Valor (R$)<input type="number" step="0.01" min="0" id="invValor" placeholder="0,00"></label><label class="f">Categoria <span class="tag pend" style="font-size:9px">a validar</span><select id="invCat">' + REGRAS.categoriasInvestimento.map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select></label><label class="f">Campanha / origem<input id="invCamp" placeholder="ex.: Meta Ads Hapvida Nov" list="campList"></label><button class="btn" onclick="addInv()">Lançar</button></div><datalist id="campList">' + Object.keys(o.porCamp).map(function (k) { return '<option value="' + esc(o.porCamp[k].nome) + '">'; }).join('') + '</datalist>';

  h += '<div class="note">Retorno líquido recebido = valor recebido − 15% de imposto − comissão do vendedor. ROI só com valor efetivamente recebido. ' + (o.semAtrib ? '<b>' + o.semAtrib + ' contrato(s) importado(s) sem origem não foram atribuídos.</b>' : '') + '</div></div>';

  // Importação
  h += '<div class="sec">Contratos linha a linha <small>enquanto a integração não envia as vendas individualizadas</small></div><div class="box bl"><div class="split"><div class="lbl">Importar CSV ' + T.info + '</div><div><button class="btn gh sm" onclick="modeloCSV()">Baixar modelo</button> ' + (ESTADO.contratos.length ? '<button class="btn gh sm" onclick="limparContratos()">Remover ' + ESTADO.contratos.length + ' contratos</button>' : '') + '</div></div>'
    + '<p class="m">Colunas: id_venda; contrato; projeto ("Projeto Hapvida" ou vazio); operadora; modalidade (PF/PME); valor_mensal; vendedor; unidade; data_venda (AAAA-MM-DD); origem; campanha; valor_recebido. Separador ; ou ,. Cada contrato grava a tabela de comissão vigente na importação — mudanças futuras não alteram o histórico.</p>'
    + '<div class="form" style="grid-template-columns:1fr auto"><input type="file" id="csvFile" accept=".csv,text/csv"><button class="btn" onclick="importarCSV()">Importar</button></div>'
    + (ESTADO.contratos.length ? '<div class="m mt">' + ESTADO.contratos.length + ' contratos carregados · ' + ESTADO.contratos.filter(function (c) { return (c.data_venda || '').slice(0, 7) === R.mes; }).length + ' em ' + mesLabel(R.mes) + '. Com contratos no mês, eles substituem os agregados no cálculo de agenciamento.</div>' : '') + '</div>';
  document.getElementById('v-roi').innerHTML = h;
}
function addInv() {
  var d = document.getElementById('invData').value, v = parseFloat(document.getElementById('invValor').value);
  if (!d || !(v > 0)) { toast('Informe data e valor'); return; }
  ESTADO.investimentos.push({ id: Date.now().toString(36), data: d, valor: r2(v), categoria: document.getElementById('invCat').value, campanha: document.getElementById('invCamp').value.trim() });
  salvarEstado(); render(); show('roi');
}
function delInv(id) { if (!confirm('Excluir este lançamento?')) return; ESTADO.investimentos = ESTADO.investimentos.filter(function (i) { return i.id !== id; }); salvarEstado(); render(); show('roi'); }
function limparContratos() { if (!confirm('Remover todos os contratos importados?')) return; ESTADO.contratos = []; salvarEstado(); render(); show('roi'); }
function modeloCSV() {
  var csv = 'id_venda;contrato;projeto;operadora;modalidade;valor_mensal;vendedor;unidade;data_venda;origem;campanha;valor_recebido\n';
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'optas-contratos-modelo.csv'; a.click();
}
function importarCSV() {
  var f = document.getElementById('csvFile').files[0]; if (!f) { toast('Escolha um arquivo'); return; }
  var rd = new FileReader();
  rd.onload = function () {
    var txt = String(rd.result).replace(/^﻿/, ''), linhas = txt.split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (linhas.length < 2) { toast('Arquivo vazio'); return; }
    var sep = linhas[0].indexOf(';') >= 0 ? ';' : ',';
    var cab = parseLinha(linhas[0], sep).map(function (c) { return norm(c).replace(/\s+/g, '_'); });
    var n = 0;
    linhas.slice(1).forEach(function (l) {
      var cols = parseLinha(l, sep), o = {};
      cab.forEach(function (c, i) { o[c] = (cols[i] || '').trim(); });
      ['valor_mensal', 'valor_recebido'].forEach(function (k) { if (o[k]) o[k] = parseNum(o[k]); });
      if (o.data_venda && /^\d{2}\/\d{2}\/\d{4}$/.test(o.data_venda)) o.data_venda = o.data_venda.split('/').reverse().join('-');
      if (o.modalidade) o.modalidade = o.modalidade.toUpperCase();
      var rg = regraVenda(o);
      if (rg && rg.ag != null) o.tabela = { nome: rg.nome, ag: rg.ag, vit: rg.vit, projeto: !!rg.projeto, versao: REGRAS.versao };
      ESTADO.contratos.push(o); n++;
    });
    salvarEstado(); render(); show('roi'); toast(n + ' contratos importados');
  };
  rd.readAsText(f, 'utf-8');
}
function parseLinha(l, sep) { var out = [], cur = '', q = false; for (var i = 0; i < l.length; i++) { var ch = l[i]; if (ch === '"') { if (q && l[i + 1] === '"') { cur += '"'; i++; } else q = !q; } else if (ch === sep && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; }
function parseNum(s) { s = String(s).replace(/[R$\s]/g, ''); if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.'); return parseFloat(s) || 0; }

function vAle() {
  var ord = { er: 0, wa: 1, in: 2 }, al = R.alertas.slice().sort(function (a, b) { return ord[a.sev] - ord[b.sev]; });
  var h = '<div class="box"><div class="split"><div class="lbl">Integridade dos dados <em>' + al.length + ' ocorrência(s) · ' + mesLabel(R.mes) + '</em></div><button class="btn gh sm" onclick="copiarAlertas()">Copiar para enviar à equipe</button></div>';
  if (!al.length) h += '<div class="empty">Nenhuma inconsistência encontrada.</div>';
  al.forEach(function (a) {
    h += '<div class="al ' + a.sev + '"><div class="ic">' + (a.sev === 'er' ? '!' : a.sev === 'wa' ? '?' : 'i') + '</div><div><h4>' + esc(a.titulo) + '</h4><p>' + a.texto + '</p><div class="kv">' + (a.impacto ? '<span>Compromete: <b>' + esc(a.impacto) + '</b></span>' : '') + (a.registros ? '<span>Registros afetados: <b>' + a.registros + '</b></span>' : '') + '</div>' + (a.acao ? '<div class="kv"><span>Correção: <b>' + esc(a.acao) + '</b></span></div>' : '') + (a.irPara ? '<div class="act"><button class="btn gh sm" onclick="show(\'' + a.irPara + '\')">Resolver</button></div>' : '') + '</div></div>';
  });
  h += '</div>';
  document.getElementById('v-ale').innerHTML = h;
}
function copiarAlertas() {
  var t = 'OPTAS · Correções necessárias no painel gerencial (' + mesLabel(R.mes) + ')\n\n' + R.alertas.filter(function (a) { return a.sev !== 'in'; }).map(function (a, i) { return (i + 1) + '. ' + a.titulo + '\n   ' + a.texto.replace(/<[^>]+>/g, '') + '\n   Compromete: ' + (a.impacto || '-') + (a.acao ? '\n   Correção: ' + a.acao : ''); }).join('\n\n');
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('Copiado'); }, function () { prompt('Copie o texto:', t); });
}

var PENDENCIAS = [
  ['1', 'Tabelas das operadoras', 'Percentuais de agenciamento/vitalício de MedSênior, Prevent, Santa Helena, Sobam, Supermed, Qualicorp, Ana Costa, São Cristóvão e Trasmontano; modalidade PF/PME de todas as 16 operadoras (inclusive as 7 já informadas).', 'Agenciamento e vitalício ficam provisórios ou não calculados.'],
  ['2', 'Regras definitivas do vitalício', 'Início na 4ª parcela para todas as operadoras/modalidades? Base: valor original ou atualizado? Continuidade igual para todas as modalidades?', 'Vitalício exibido por parcela e fora do ROI.'],
  ['3', 'Acúmulo da reserva de marketing', 'A verba não utilizada acumula para o mês seguinte ou expira no fechamento?', 'Saldo calculado só dentro do mês.'],
  ['4', 'Base definitiva do ROI', 'Quais componentes formam o retorno líquido atribuído (recebidas, 15% de imposto, comissões dos vendedores, outros custos)?', 'ROI usa base provisória: agenciamento − imposto − comissão do vendedor.'],
  ['5', 'Categorias de investimento', 'Validar: tráfego pago, compra de leads, campanhas comerciais, outras ações de captação.', 'Categorias disponíveis para lançamento, marcadas "a validar".'],
  ['6', 'Origem dos contratos na integração', 'A integração disponibilizará origem, campanha e identificação do investimento?', 'Nenhum contrato atribuível hoje — ROI sem base.'],
  ['8', 'Comissão do Projeto Hapvida', 'Agenciamento e vitalício do Projeto Hapvida (comissão inferior à Hapvida comum). Venda Hapvida fora do projeto já usa 350% + 2%.', 'Produção do projeto fica fora do agenciamento a receber até a regra ser informada.'],
  ['9', 'Vínculo com planilha e CRM', 'Link da planilha e campos do CRM (PipeRun) com venda a venda: projeto, operadora, modalidade, valor, vendedor, unidade, data, origem/campanha.', 'Painel usa os totais por vendedor do painel atual.'],
  ['7', 'Validação contábil dos encargos', 'FPAS/terceiros, RAT, incidências efetivas e encargos já incluídos nos R$ 39.185,43.', 'Provisão de R$ 1.623,15 é estimativa gerencial.']
];
function vPen() {
  var h = '<div class="box rd"><div class="lbl">Pendências para finalizar a modelagem <em>mantidas separadas das regras confirmadas</em></div><div class="tw"><table><thead><tr><th>#</th><th>Pendência</th><th>O que falta</th><th>Como o painel trata hoje</th></tr></thead><tbody>';
  PENDENCIAS.forEach(function (p) { h += '<tr><td><b>' + p[0] + '</b></td><td style="white-space:normal;min-width:160px"><b>' + p[1] + '</b></td><td style="white-space:normal;min-width:280px">' + p[2] + '</td><td style="white-space:normal;min-width:220px" class="m">' + p[3] + '</td></tr>'; });
  h += '</tbody></table></div><div class="note">Prioridade: tabelas das operadoras → vitalício → decisões de ROI e orçamento de marketing.</div></div>';
  h += '<div class="box mt"><div class="lbl">Fora do escopo desta etapa</div><p class="m">Distribuição de lucros entre W3G e sócias · média de comissões para provisionamento da folha · controle individual de salários fixos · CPL/ROI avançado sem atribuição confiável · conciliação detalhada por pagamento de operadora · estornos, cancelamentos, descontos e recebimentos parciais.</p></div>';
  document.getElementById('v-pen').innerHTML = h;
}

function regra(t, f, d) { return '<div class="box dk"><div class="lbl">' + t + '</div><div class="fx">' + f + '</div><div class="m">' + d + '</div></div>'; }
function vReg() {
  var h = '<div class="grid g2"><div class="box"><div class="lbl">Comissão dos vendedores <em>% da faixa sobre toda a produção</em></div>';
  REGRAS.unidades.forEach(function (u) {
    var fx = REGRAS.faixas[u];
    h += '<div class="m mt" style="font-weight:700;color:var(--ink)">' + u + '</div><div class="tw"><table><tbody>' + fx.map(function (f, i) { return '<tr><td>' + (fx[i + 1] ? brl(f.de || 1) + ' a ' + brl(fx[i + 1].de - 0.01) : 'A partir de ' + brl(f.de)) + '</td><td class="r"><span class="tier">' + pct(f.pct) + '</span></td></tr>'; }).join('') + '</tbody></table></div>';
  });
  h += '</div><div class="box"><div class="lbl">Comissões das operadoras <em>tabela ' + REGRAS.versao + '</em></div><div class="tw"><table><thead><tr><th>Operadora</th><th class="r">Agenciamento</th><th class="r">Vitalício</th><th>PF/PME</th></tr></thead><tbody>';
  REGRAS.projetos.forEach(function (o) { h += '<tr style="background:var(--peach)"><td><b>' + o.nome + '</b> <span class="m">regra própria</span></td><td class="r">' + (o.ag != null ? pct(o.ag) : '<span class="tag pend">pendente</span>') + '</td><td class="r">' + (o.vit != null ? pct(o.vit) : '<span class="tag pend">pendente</span>') + '</td><td>—</td></tr>'; });
  REGRAS.operadoras.forEach(function (o) { h += '<tr><td>' + (o.nome === 'Hapvida' ? 'Hapvida <span class="m">fora do projeto</span>' : o.nome) + '</td><td class="r">' + (o.ag != null ? pct(o.ag) : '<span class="tag pend">pendente</span>') + '</td><td class="r">' + (o.vit != null ? pct(o.vit) : '<span class="tag pend">pendente</span>') + '</td><td>' + (o.modalidades ? Object.keys(o.modalidades).join(' / ') : '<span class="tag pend">não informado</span>') + '</td></tr>'; });
  h += '</tbody></table></div></div></div>';
  h += '<div class="grid g3 mt">' + card('Imposto', '15%', 'Sobre agenciamento e vitalício, todas as operadoras. Não é descontado do vendedor.', { box: 'dk' })
    + card('Reserva de marketing', '15%', 'Sobre o lucro bruto operacional = comissões efetivamente recebidas − comissões pagas aos vendedores. Destinação do resultado, não despesa.', { box: 'dk' })
    + card('Vitalício', 'a partir da ' + REGRAS.vitalicio.inicioParcela + 'ª parcela', 'Enquanto o contrato estiver ativo, % da operadora. ' + T.pend, { box: 'dk' }) + '</div>';
  h += '<div class="sec">Fórmulas do sistema <small>cada regra nova entra aqui</small></div><div class="grid g2">'
    + regra('Lucro ou prejuízo da unidade', 'Resultado operacional = comissões efetivamente recebidas − 15% de imposto − comissões dos vendedores − custo fixo − provisão 13º/férias', 'Positivo = LUCRO · negativo = PREJUÍZO. Calculado por unidade e no consolidado (soma das duas).')
    + regra('Mínimo para não fechar no vermelho', 'Recebidas mínimas = (comissões dos vendedores + custo fixo + provisão) ÷ 0,85', 'Valor de comissões recebidas no mês em que o resultado operacional é zero.')
    + regra('Mínimo sustentável', 'Recebidas mínimas = (0,85 × comissões dos vendedores + custo fixo + provisão) ÷ 0,70', 'Não fecha no vermelho e ainda forma a reserva de marketing de 15% do lucro bruto operacional.')
    + regra('Resultado financeiro', 'Resultado financeiro = resultado operacional − reserva de marketing', 'Reserva = 15% × (recebidas − comissões dos vendedores). É destinação do resultado, não despesa.')
    + regra('Qual comissão se aplica a cada venda', '1º tabela gravada na data da venda → 2º regra do projeto (Projeto Hapvida) → 3º tabela da operadora', 'Hapvida fora do projeto usa 350% + 2%. Mudanças futuras de tabela não alteram vendas antigas.')
    + regra('Custo total da Optas no mês', 'Custo total = comissões dos vendedores + custo fixo + provisão 13º/férias', 'Soma de tudo que a Optas paga no mês para operar, sem impostos e sem reserva de marketing.')
    + regra('Comissão do vendedor', 'Comissão = produção do mês × percentual da faixa atingida', 'O percentual incide sobre toda a produção. Sem médias históricas.')
    + '</div>';
  document.getElementById('v-reg').innerHTML = h;
}

/* =====================================================================
   7. NAVEGAÇÃO E INICIALIZAÇÃO
   ===================================================================== */
function show(v) {
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('on', t.dataset.v === v); });
  document.querySelectorAll('.view').forEach(function (s) { s.classList.toggle('on', s.id === 'v-' + v); });
  try { localStorage.setItem('optas_tab', v); } catch (e) {}
  if (location.hash !== '#' + v) history.replaceState(null, '', '#' + v);
}
document.getElementById('tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) show(b.dataset.v); });

function iniciar() {
  var tab = location.hash.slice(1); if (!tab) { try { tab = localStorage.getItem('optas_tab'); } catch (e) {} }
  if (GAS) {
    google.script.run.withSuccessHandler(function (r) {
      var x = typeof r === 'string' ? JSON.parse(r) : r;
      FONTE = x && x.dados ? x.dados : SNAPSHOT; FONTE_DESC = x && x.dados ? 'painel gerencial integrado (PipeRun + ASI) · atualizado às ' + (FONTE.atualizado || '—') : SNAPSHOT_ORIGEM + ' — integração indisponível';
      ESTADO = normEstado(x && x.estado ? JSON.parse(x.estado) : null);
      render(); if (tab) show(tab);
    }).withFailureHandler(function () { FONTE = SNAPSHOT; FONTE_DESC = SNAPSHOT_ORIGEM; render(); }).optasCarregar();
    setInterval(function () { google.script.run.withSuccessHandler(function (r) { var x = typeof r === 'string' ? JSON.parse(r) : r; if (x && x.dados) { FONTE = x.dados; render(); } }).optasCarregar(); }, 5 * 60 * 1000);
  } else {
    FONTE = SNAPSHOT; FONTE_DESC = SNAPSHOT_ORIGEM;
    ESTADO = normEstado(DEMO ? JSON.parse(JSON.stringify(ESTADO_DEMO)) : carregarEstadoLocal());
    if (DEMO) { var bn = document.createElement('div'); bn.className = 'demo'; bn.innerHTML = '<b>MODO EXEMPLO</b> · produção e comissões dos vendedores são reais (painel de 23/11 18:53). Recebidas, investimentos e os 4 contratos EX1–EX4 são <b>fictícios</b>, só para visualizar o layout.'; document.querySelector('.wrap').insertBefore(bn, document.getElementById('tabs')); }
    render(); if (tab && document.getElementById('v-' + tab)) show(tab);
  }
}
iniciar();
</script>
